<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- ⚠️ هذا السطر مطلوب ولا يمكن حذفه -->
  <base href="/tasbiha/">

  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  <!-- إعدادات PWA -->
  <meta name="theme-color" content="#009688">
  <meta name="description" content="تطبيق تسبيحة - أذكار، أدعية، قرآن كريم، واتجاه القبلة">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="تسبيحة">
  
  <!-- روابط الأيقونات -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  
  <title>تطبيق تسبيحة</title>
  
  <!-- تحميل خط أميري -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #009688;
      font-family: 'Amiri', serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #ffffff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- شاشة التحميل -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>جاري تحميل تطبيق تسبيحة...</p>
  </div>

  <!-- سكربتات Flutter -->
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // تسجيل Service Worker للعمل بدون إنترنت
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=34640357') /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
      });
    }
  </script>
</body>
</html>
